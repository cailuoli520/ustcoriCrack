<script type="text/javascript">
    $(document).ready(function () {
        _enviroment.Language = "ZH-CN";

        $("#bgdiv").css("background-image", "url(" + _websiteName +"/Images/login/login_bj.png)");
       
        //加载访问人次信息
        $.ajax({
            type: 'post',
            url: _websiteName + '/Login/InitAccessCount',
            data: {},
            success: function (result) {
                if (result.IsSuccess) {
                    $("#accesscount").text(result.Data);
                }
                else {
                    $("#accesscount").text("0");
                }
            }
        }); //结束
    }); 
</script>
<style type="text/css">
    .image-border
    {
        position: absolute;
        width: 20px;
        height: 20px;
    }
    .image-border1
    {
        top: 0;
        left: 0;
        border-left: 5px solid #FFFFFF;
        border-top: 5px solid #FFFFFF;
    }
    .image-border2
    {
        top: 0;
        right: -2px;
        border-right: 5px solid #FFFFFF;
        border-top: 5px solid #FFFFFF;
    }
    .image-border3
    {
        bottom: 0;
        left: 0;
        border-bottom: 5px solid #FFFFFF;
        border-left: 5px solid #FFFFFF;
    }
    .image-border4
    {
        bottom: 0;
        right: -2px;

    }
</style>
<div class="modal fade" id="ChangeUserRoleModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title text-center" id="ChangeUserRoleModalLabel" style="font-size: 28px;">
                    您已经90天没有修改过密码，请修改密码后在登录！
                </h4>
            </div>
            <div class="modal-body">
                <div id="ChangeRoleContent" class="text-center">
                    <form class="form-horizontal" id="TempleteForm" method="post" name="form-horizontal"
                    enctype="multipart/form-data" action="/ReportAdmin/UserManage/UpdatePass">
                    <table class="tablePadding" border="0" cellpadding="0" cellspacing="0" width="500px"
                        style="background: #fff">
                        <tbody>
                            <td width="25%" class="align-right">
                                <label for="oldPassword" class="control-label">
                                    原密码：</label>
                            </td>
                            <td class="form-group align-left">
                                <input type="password" class="form-control password" id="oldPassword" name="oldPassword"
                                    placeholder="请输入原密码" />
                            </td>
                            </tr>
                            <tr>
                                <td width="25%" class="align-right">
                                    <label for="newPassword" class="control-label">
                                        新密码：</label>
                                </td>
                                <td class="form-group align-left">
                                    <input type="password" class="form-control password" id="newPassword" name="newPassword"
                                        placeholder="请输入新密码" />
                                </td>
                            </tr>
                            <tr>
                                <td width="25%" class="align-right">
                                    <label for="againPassword" class="control-label">
                                        确认密码：</label>
                                </td>
                                <td class="form-group align-left">
                                    <input type="password" class="form-control password" id="againPassword" name="againPassword"
                                        placeholder="请再次确认密码" />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="SaveTemplete();">
                    保存
                </button>
            </div>
        </div>
    </div>
</div>
<!--切换用户-->
<input type="hidden" id="loginStatus" />
<div class="content">
    <input type="text" style="display: none;" value="0" id="IsSupportNationalVirtual" />
    <input type="text" style="display: none;" value="光学扳手" id="_nationalVirtualLabName" />
    <div id="bgdiv" align="center" style="width: 100%; height: 950px; background-image: url(./Images/login/login_bj.png);
        background-repeat: repeat-x; margin: 0 auto; background-size: 100% 100%;">
        <div align="center" style="width: 1200px; height: 80px; line-height: 80px;">
            <div style="float: left; width: 40%; font-size: 14px; margin-top: 20px;" align="left">
                <img src="/Images/zy_logo.png" style="width: 100%;" />
            </div>
            <div style="float: right; width: 25%; font-size: 14px; margin-top: 0px;" align="right">
                <div class="row">
                    <span class="welcome">访问人次:</span> <span class="welcome" id="accesscount" style="text-align: right;">
                        0</span> <span class="welcome">人次&nbsp;|&nbsp;</span> <span class="welcome" id="languageSpan"
                            onclick="ChangeLanguage();">English</span>
                </div>
            </div>
        </div>
        <div align="right" style="width: 1200px; height: 780px; padding-top: 11%;">
            <div class="login" style="height: 293px;" align="center">
                <div class="row login_table">
                    <div class="col-md-12 form-horizontal" id="loginForm">
                        <div class="row text-left">
                            <div class="title" style="width: 100px; margin: 0px auto; font-weight: bold; letter-spacing: 4px;">
                                用户登录
                            </div>
                        </div>
                        <div class="row form-group text-center">
                            <div class="col-md-12">
                                <input type="text" style="height: 35px;" class="form-control user" placeholder="请输入用户名"
                                    id="userName" name="userName" /></div>
                        </div>
                        <div class="row form-group text-center">
                            <div class="col-md-12">
                                <input type="password" style="height: 35px;" class="form-control password" placeholder="请输入密码8-20位"
                                    id="userPass" name="password" onkeypress="if(event.keyCode==13) {loginClick();}" /></div>
                        </div>
                        <div class="row form-group text-center">
                            <div class="col-md-12">
                                <input type="text" id="checkCode" maxlength="4" class="form-control password" style="width: 230px;
                                    height: 35px;" placeholder="请输入验证码" onkeypress="if(event.keyCode==13) {loginClick();}" />
                                <a href="#">
                                    <img id="imgCheckCode" alt="点击刷新" src="/CheckCode.ashx?Flag=DengLu" onclick="javascript: this.src = _websiteName + '/CheckCode.ashx?Flag=DengLu&aa=' + Math.random();"
                                        width="69" height="35" style="vertical-align: middle;" /></a>
                            </div>
                        </div>
                        <div class="row form-group text-center">
                            <div class="col-12">
                                <button class="login_but" style="" onclick="loginClick()">
                                    登&nbsp;录</button>
                            </div>
                        </div>
                        <!--<div class="row form-group text-center">
                            <div class="col-12">
                                <button class="login_but" style="margin-top: 0px; margin-bottom: 25px;">
                                    <a style="font-size: 18px; color: white; margin: 0px,20px,0px,0px;" href="/Login/VisitorsUserLogin">
                                        专家入口</a></button>
                            </div>
                        </div>-->
                    </div>
                </div>
            </div>
        </div>
        <div class="row" style="font-size: 16px; color: White;">
            技术支持：科大奥锐 <span id="spBanQuan"></span>（浏览器兼容性:火狐 Firefox-55.0以上,谷歌Chrome
            60.0 以上,搜狗浏览器(高速模式)等。）
        </div>
    </div>
</div>
